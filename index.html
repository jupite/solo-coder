<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赶羊游戏 - Sheep Herding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #87CEEB;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
        }
        
        #ui div {
            margin: 5px 0;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
        }
        
        #controls div {
            margin: 3px 0;
        }
        
        #victory-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            z-index: 200;
            display: none;
        }
        
        #victory-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        
        #victory-screen p {
            font-size: 24px;
            margin: 10px 0;
        }
        
        #victory-screen button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        #victory-screen button:hover {
            background: #45a049;
        }
        
        #bark-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui">
            <div>🏆 分数: <span id="score">0</span></div>
            <div>⏱️ 时间: <span id="time">0</span>秒</div>
            <div>🐑 已入圈: <span id="sheep-in">0</span>/5</div>
        </div>
        
        <div id="controls">
            <div>🎮 WASD - 移动</div>
            <div>🔊 空格 - 吠叫</div>
            <div>🎯 将所有羊赶入羊圈</div>
        </div>
        
        <div id="bark-indicator">汪！</div>
        
        <div id="victory-screen">
            <h1>🎉 恭喜过关！</h1>
            <p>最终分数: <span id="final-score">0</span></p>
            <p>用时: <span id="final-time">0</span>秒</p>
            <button onclick="location.reload()">再玩一次</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
