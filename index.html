<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悬崖跳水</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
    #game-container { position: relative; width: 100vw; height: 100vh; }
    #ui {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #power-bar-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 30px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #fff;
      border-radius: 5px;
      overflow: hidden;
      display: none;
    }
    #power-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
      transition: width 0.05s linear;
    }
    #score-display {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 48px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      display: none;
    }
    #score-breakdown {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 16px;
      text-align: center;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      display: none;
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      text-align: center;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 5px;
    }
    #action-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      font-size: 16px;
      text-align: right;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }
    #restart-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 40px;
      font-size: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      pointer-events: auto;
      display: none;
      z-index: 20;
    }
    #restart-btn:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="ui">
    <div id="power-bar-container">
      <div id="power-bar"></div>
    </div>
    <div id="score-display"></div>
    <div id="score-breakdown"></div>
    <div id="action-indicator"></div>
    <div id="instructions">
      按 空格键 蓄力并释放跳跃 | 空中按 W/S 前翻/后翻 | 按 A/D 侧翻 | 按 R 重新开始
    </div>
    <button id="restart-btn">再来一次</button>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
