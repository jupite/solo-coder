<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节奏架子鼓 - Rhythm Drum Game</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="game-container">
    <div id="game-canvas-container"></div>
    <div id="ui-overlay">
      <div id="score-panel">
        <div class="score-label">SCORE</div>
        <div id="score-value">0</div>
        <div class="combo-label">COMBO</div>
        <div id="combo-value">0</div>
        <div id="fever-indicator" class="hidden">
          <div class="fever-text">FEVER MODE!</div>
          <div class="fever-multiplier">x2 SCORE</div>
        </div>
      </div>
      <div id="key-hints">
        <div class="key-hint key-red">F</div>
        <div class="key-hint key-blue">G</div>
        <div class="key-hint key-yellow">H</div>
      </div>
      <div id="instructions">
        <p>按 F/G/H 键或点击对应鼓面打击音符</p>
        <p>连续击中10次进入狂热模式！</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
