<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 钓鱼游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8C8 100%);
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        #score-board .label {
            color: #98D8C8;
            font-size: 14px;
        }

        #score-board .value {
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
        }

        #tension-container {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            display: none;
        }

        #tension-container.visible {
            display: block;
        }

        #tension-label {
            text-align: center;
            color: white;
            font-size: 16px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #tension-bar {
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        #tension-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4444, #ffaa00, #44ff44);
            transition: width 0.05s ease-out;
            border-radius: 12px;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #FFD700;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            display: none;
            animation: pulse 0.5s ease-in-out infinite alternate;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        }

        #message.visible {
            display: block;
        }

        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.05); }
        }

        #instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 14px;
        }

        #result-popup {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 50px;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            display: none;
            animation: slideDown 0.5s ease-out;
        }

        #result-popup.visible {
            display: block;
        }

        #result-popup.success {
            background: rgba(76, 175, 80, 0.9);
            color: white;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.8);
        }

        #result-popup.fail {
            background: rgba(244, 67, 54, 0.9);
            color: white;
            box-shadow: 0 0 30px rgba(244, 67, 54, 0.8);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-container">
        <div id="score-board">
            <div class="label">钓到的鱼</div>
            <div class="value" id="fish-count">0</div>
        </div>
        <div id="tension-container">
            <div id="tension-label">快速按空格键收线！</div>
            <div id="tension-bar">
                <div id="tension-fill"></div>
            </div>
        </div>
        <div id="message"></div>
        <div id="result-popup"></div>
        <div id="instruction">点击水面抛竿 | 空格键收线</div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
