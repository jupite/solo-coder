<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 打砖块游戏</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">分数</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">生命</span>
        <span id="lives" class="hud-value">3</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">球速</span>
        <span id="speed" class="hud-value">1.0x</span>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <h1>3D 打砖块</h1>
      <p>使用 WASD 控制底板移动</p>
      <p>消除所有砖块获得胜利</p>
      <button id="start-btn">开始游戏</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
      <h1 id="game-result">游戏结束</h1>
      <p>最终分数: <span id="final-score">0</span></p>
      <button id="restart-btn">重新开始</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
