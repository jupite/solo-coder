<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投掷游戏 - Three.js</title>
  <script type="module" crossorigin src="/assets/index-Clzn3QDH.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BiyGZwJj.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-container">
            <div class="score-panel">
                <div class="score-item">
                    <span class="label">得分</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">剩余次数</span>
                    <span id="throws-left" class="value">5</span>
                </div>
            </div>
            
            <div id="power-indicator" class="power-indicator hidden">
                <div class="power-bar">
                    <div id="power-fill" class="power-fill"></div>
                </div>
                <span class="power-label">力度</span>
            </div>
            
            <div id="game-over" class="game-over hidden">
                <h2>游戏结束</h2>
                <p>最终得分: <span id="final-score">0</span></p>
                <button id="restart-btn">重新开始</button>
            </div>
            
            <div class="instructions">
                <p>按住鼠标向后拖动瞄准，松开发射</p>
                <p>鼠标右键拖动旋转相机</p>
                <p>滚轮缩放视角</p>
            </div>
        </div>
    </div>
    
</body>
</html>
